<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>知序 AI 学院 · Apple Edition</title>
<style>html,body{margin:0;min-height:100%;background:#f5f5f7;color:#343b3a;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{min-height:100vh;display:grid;place-items:center}a{color:#166f64}</style>
<script>
(function(){
  var query=new URLSearchParams(location.search);
  // Default all competition and judge visits to Apple; explicit Original fallback remains.
  if(query.get('edition')==='original'){
    query.delete('edition');
    var original=new URL('./original.html',location.href);
    original.search=query.toString();original.hash=location.hash;
    location.replace(original.href);
    return;
  }
  var edition=query.get('edition');
  if(edition==='r3'||edition==='v4'||edition==='v5')query.delete('edition');
  var target=edition==='r3'?'./apple-editions/ai-academy-apple/':edition==='v4'?'./apple-editions/ai-academy-v4/':'./apple-editions/ai-academy-v5/';
  var next=new URL(target,location.href);
  next.search=query.toString();next.hash=location.hash;
  location.replace(next.href);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=./apple-editions/ai-academy-v5/"></noscript>
</head>
<body><main role="status">正在进入 Apple Edition…<br><a href="./apple-editions/ai-academy-v5/">直接打开 Apple V5 版</a></main></body>
</html>
